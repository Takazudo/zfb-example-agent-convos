name: Bootstrap source

on:
  push:
    branches:
      - bootstrap-agent-convos

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Assemble source archive
        shell: bash
        run: |
          cat .bootstrap/parts/*.txt | base64 --decode > /tmp/source.tar.gz
          tar -tzf /tmp/source.tar.gz >/tmp/source-files.txt
          tar -xzf /tmp/source.tar.gz
          rm -rf .bootstrap .github/workflows/bootstrap-source.yml

      - name: Commit implementation to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement durable agent conversation recipe"
          git push origin HEAD:main
