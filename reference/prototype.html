  }
  async function setScenario(name) {
    stopTimers(); closeDialogs(); ui.disconnected = false; ui.scenario = validScenarios.includes(name) ? name : 'review'; ui.active = 'release'; ui.section = 'conversations'; ui.archived = false; ui.query = ''; ui.diff = false; ui.trace = false; ui.forceBottom = ui.scenario !== 'long';
    const c = await service.loadScenario(ui.scenario); view = service.getSnapshot(); render();
    if (name === 'streaming' || name === 'reconnecting') { const r = latestRun(c); if (name === 'reconnecting') { ui.cursor = c.seq; ui.disconnected = true; render(); } simulate({ conversationId: c.id, runId: r.id },true); }
    if (name === 'long') $('.transcript')?.scrollTo({ top: 0, behavior: 'instant' });
    announce('Demo scenario loaded: ' + name + '. Synthetic changes were reset.');
  }
  async function submitMessage(e) {
    e?.preventDefault();
    if (ui.disconnected) return;
    const input = $('#message-input'); if (!input || input.disabled || !input.value.trim()) return;
    try { const info = await service.sendMessage(ui.active,input.value,requestKey()); ui.forceBottom = true; simulate(info,true); announce('Request accepted by the mock service.'); } catch (error) { showError(error); }
  }
  function showError(error) {
    const messages = { RESOLVE_RUN_BEFORE_ARCHIVING: 'Finish, reject, or stop the active run before archiving.', RUN_IN_PROGRESS: 'Resolve the active run before sending another request.', SKILL_VERSION_CONFLICT: 'The skill changed since you opened the editor. Close it and review the current version.', CONVERSATION_ARCHIVED: 'Restore this conversation before sending a message.', PROPOSAL_NOT_PENDING: 'This proposal has already been resolved.', INVALID_MESSAGE: 'Enter a message of at most 16,000 characters.' };
    toast(messages[error.message] || error.message || 'The demo action failed.');
  }
  document.addEventListener('input', e => {
    if (e.target.id === 'message-input') { service.setDraft(ui.active,e.target.value); const send = $('#composer-form button[type="submit"]'); if (send) send.disabled = !e.target.value.trim(); }
    if (e.target.matches('[data-search]')) { ui.query = e.target.value; const focusedId = e.target.id; if ($('#sheet').open) { const selection = e.target.selectionStart; $('#sheet').innerHTML = navMarkup(true); const f = document.getElementById(focusedId); f?.focus(); f?.setSelectionRange(selection,selection); } else render(); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.id === 'message-input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submitMessage(); }
  });
  document.addEventListener('change', async e => { if (e.target.id === 'scenario') await setScenario(e.target.value); if (e.target.id === 'skill-select') { ui.skill = e.target.value; ui.skillVersion = null; render(); } });
  document.addEventListener('click', async e => {
    const target = e.target.closest('[data-action]'); if (!target || target.disabled) return;
    const action = target.dataset.action;
    try {
      if (action === 'new') { closeDialogs(); ui.disconnected = false; const c = await service.createConversation(); ui.active = c.id; ui.section = 'conversations'; ui.archived = false; ui.forceBottom = true; view = service.getSnapshot(); render(); $('#message-input')?.focus(); }
      else if (action === 'open-convo') { closeDialogs(); ui.active = target.dataset.id; ui.section = 'conversations'; ui.forceBottom = true; ui.diff = false; view = service.getSnapshot(); render(); }
      else if (action === 'nav-conversations') { closeDialogs(); ui.section = 'conversations'; view = service.getSnapshot(); render(); }
      else if (action === 'nav-skills') { closeDialogs(); ui.section = 'skills'; view = service.getSnapshot(); render(); }
      else if (action === 'archive-view') { ui.archived = !ui.archived; if ($('#sheet').open) $('#sheet').innerHTML = navMarkup(true); else render(); }
      else if (action.startsWith('layout-')) { ui.layout = action.slice(7); ui.details = false; render(); }
      else if (action === 'mobile-history') openSheet('history');
      else if (action === 'details') { ui.details = !ui.details; if (innerWidth <= 920 || (ui.layout === 'embedded' && innerWidth <= 1190)) { ui.details = true; openSheet('details'); } else render(); }
      else if (action === 'close-details') { ui.details = false; if ($('#sheet').open) $('#sheet').close(); render(); }
      else if (action === 'detail-tab') { ui.detailTab = target.dataset.tab; if ($('#sheet').open) $('#sheet').innerHTML = inspectorMarkup(current()); else render(); }
      else if (action === 'toggle-diff') { ui.diff = !ui.diff; render(); }
      else if (action === 'approve') { if (ui.disconnected) return; const p = current().proposal; const result = await service.approve(ui.active,p.id,'approve-' + p.id); ui.forceBottom = true; toast(result.status === 'conflicted' ? 'The base revision changed. Nothing was applied.' : 'Applied once to the demo store. Nothing was published.'); }
      else if (action === 'request-changes') { await service.reject(ui.active); service.setDraft(ui.active,'Please revise the draft: '); view = service.getSnapshot(); render(); $('#message-input')?.focus(); }
      else if (action === 'stop') { const id = ui.active; clearTimeout(timers.get(id)); timers.delete(id); await service.cancel(id); toast('Simulated run stopped. The partial reply is kept.'); }
      else if (action === 'retry') { if (ui.disconnected) return; const info = await service.retry(ui.active,requestKey()); ui.forceBottom = true; simulate(info,true); toast('Started a new run for the same user request.'); }
      else if (action === 'reconnect') { const result = await service.eventsAfter(ui.active,ui.cursor); ui.cursor = result.nextCursor; ui.disconnected = false; view = service.getSnapshot(); render(); toast('Replayed ' + result.events.length + ' missed mock events without duplicating messages.'); }
      else if (action === 'jump') $('.transcript')?.scrollTo({ top: $('.transcript').scrollHeight, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
      else if (action === 'starter') { service.setDraft(ui.active,target.dataset.text); view = service.getSnapshot(); render(); $('#message-input')?.focus(); }
      else if (action === 'menu') modal('Conversation actions',`<div class="menu-items">${btn('rename-dialog',icon('edit')+'Rename conversation','')}${btn('export',icon('download')+'Export this conversation as JSON','')}${btn(current().archived ? 'restore' : 'archive',icon('archive')+(current().archived ? 'Restore conversation' : 'Archive conversation'),'')}${latestRun(current())?.status === 'awaiting_approval' ? btn('reject-from-menu',icon('close')+'Close proposal without applying','') : ''}</div><p class="review-explainer">Archive hides a conversation; it is not deletion. Exports contain only synthetic demo data.</p>`);
      else if (action === 'rename-dialog') modal('Rename conversation',`<label for="rename-input">Title</label><input id="rename-input" maxlength="120" value="${esc(current().title)}">`,btn('close-modal','Cancel','secondary')+btn('rename-save','Save title','primary'));
      else if (action === 'rename-save') { await service.rename(ui.active,$('#rename-input').value); $('#modal').close(); toast('Conversation renamed.'); }
      else if (action === 'archive' || action === 'restore') { await service.archive(ui.active,action === 'archive'); ui.archived = action === 'archive'; closeDialogs(); toast(action === 'archive' ? 'Archived, not deleted.' : 'Conversation restored.'); }
      else if (action === 'reject-from-menu') { await service.reject(ui.active); closeDialogs(); toast('Proposal closed. No changes were applied.'); }
      else if (action === 'export') { const data = await service.getConversation(ui.active); const blob = new Blob([JSON.stringify({ schemaVersion: 1, source: 'synthetic-browser-prototype', conversation: data },null,2)],{ type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'convos-' + data.id + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href),1000); closeDialogs(); toast('Synthetic conversation exported.'); }
      else if (action === 'open-skill') { closeDialogs(); ui.section = 'skills'; ui.skill = target.dataset.id; ui.skillVersion = target.dataset.version ? Number(target.dataset.version) : null; ui.skillTab = target.dataset.version ? 'history' : 'content'; view = service.getSnapshot(); render(); }
      else if (action === 'skill-tab') { ui.skillTab = target.dataset.tab; render(); }
      else if (action === 'skill-version') { ui.skillVersion = Number(target.dataset.version); render(); }
      else if (action === 'edit-skill') { const s = view.skills.find(s => s.id === ui.skill); ui.editingSkillBase = s.head; modal('Edit ' + esc(s.name),`<div class="field"><label for="skill-body-input">Instructions · currently v${s.head}</label><textarea id="skill-body-input" maxlength="32000">${esc(s.versions[s.versions.length-1].body)}</textarea></div><div class="field"><label for="skill-note-input">Change note</label><input id="skill-note-input" placeholder="What changed?" maxlength="160"></div><p>Saving creates v${s.head+1}. Existing runs keep their pinned versions.</p>`,btn('close-modal','Cancel','secondary')+btn('save-skill','Save new version','primary')); }
      else if (action === 'save-skill') { const v = await service.reviseSkill(ui.skill,$('#skill-body-input').value,$('#skill-note-input').value,ui.editingSkillBase); ui.skillVersion = v.version; ui.skillTab = 'history'; $('#modal').close(); toast('Created v' + v.version + '. Existing run pins are unchanged.'); }
      else if (action === 'restore-skill') { const s = view.skills.find(s => s.id === ui.skill); const v = await service.restoreSkill(s.id,Number(target.dataset.version),s.head); ui.skillVersion = v.version; toast('Restored as new version v' + v.version + '. No history was rewritten.'); }
      else if (action === 'about') modal('A recipe, not another platform',`<p><strong>convos /</strong> is an interactive design prototype for <code>zfb-example-agent-convos</code>.</p><p>It demonstrates multiple conversations, explicit change review, interrupted runs, immutable skill versions, and a reusable embedded conversation surface.</p><p><strong>All data is synthetic.</strong> No model calls, Cloudflare resources, account credentials, or real CMS changes are involved. Data is saved only in this browser when local storage is available.</p><p>Scenario selection resets the demo. Reconnection is a simulated interruption of the view while the in-page mock service continues. Closing this file stops its timers; this does not prove backend durability.</p><p>The production handoff uses a server-owned event log and host-authorized tools. The prototype intentionally has no login or deletion UI.</p>`);
      else if (action === 'reset') modal('Reset this demo?',`<p>This replaces synthetic conversations, drafts, and skill revisions in this browser with the starting fixtures. No remote data exists.</p>`,btn('close-modal','Keep my demo','secondary')+btn('reset-confirm','Reset demo','primary'));
      else if (action === 'reset-confirm') { await setScenario('review'); toast('Synthetic demo data reset.'); }
      else if (action === 'close-modal') $('#modal').close();
      else if (action === 'close-sheet') $('#sheet').close();
    } catch (error) { showError(error); }
  });
  // Read-only diagnostics for the bundled browser tests. This is not a production global.
  window.__CONVOS_DEMO__ = { snapshot: () => service.getSnapshot(), getUI: () => ({ ...ui }), setScenario, service };
  render();
  if (params.has('scenario') && validScenarios.includes(params.get('scenario'))) setScenario(params.get('scenario')).then(() => { if (params.get('screen') === 'skills') { ui.section = 'skills'; render(); } });
  else {
    // Browser-only interrupted timers never masquerade as a durable server run.
    for (const c of view.conversations) if (latestRun(c)?.status === 'running') service.cancel(c.id);
  }
})();

</script>
